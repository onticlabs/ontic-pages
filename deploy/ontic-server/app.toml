# ontic-pages as an ontic-server app (github.com/onticlabs/ontic-server, the
# commit in tool.lock). Copied from its templates/app/ and filled in for
# pages. The older deploy (deploy/deploy.sh and pages.sh, one folder up) still
# runs the live pages.onticlabs.io on ontic-vps; this folder does not touch it.
#
# Runtime settings live ONLY in quadlet/*.container, routing ONLY in
# Caddyfile; this file never repeats them. Unknown keys are an error.
#
# As written it deploys on the rehearsal box (ontic-server
# hosts/netcup-rehearsal.toml) under pages.62-83-41-41.sslip.io, a public
# name that resolves to that box's address without any DNS change of ours.
# Moving to the real name means changing it here, in Caddyfile and in both
# quadlet/*.container files.

[app]
name = "pages"
description = "ontic-pages: the team's hosted HTML pages (gateway plus Google sign-in)"

[build]
# The gateway image builds from the repository root with deploy/Dockerfile,
# the same image the older deploy builds. The deploy builds the exact git
# commit on the box, never the working tree.
context = "../.."
containerfile = "../Dockerfile"
image = "localhost/pages"

[units]
managed = ["pages.network", "pages-gateway.container", "pages-oauth2-proxy.container"]

[health]
timeout_seconds = 120
settle_seconds = 10
# Only on a first deploy to a new name: how long to wait for Caddy's first
# certificate (a busy certificate authority makes Caddy retry for minutes).
certificate_timeout_seconds = 300
# The gateway answers /_health on any host before it reads the bucket or asks
# oauth2-proxy anything, so this works with dummy bucket credentials.
port = 8790
path = "/_health"
expected_status = 200
# The apex. Page hosts (*.<apex>) get certificates on demand (Caddyfile), so
# only the apex has a certificate the deploy can check.
public_host = "pages.62-83-41-41.sslip.io"
public_checks = [{ path = "/_health", status = 200 }]

[deploy]
strategy = "stop-first"
auto_rollback = true

[state]
# Every page lives in the bucket; the box keeps no data of its own.
kind = "stateless"
data_dir = ""
backup = false

[auth]
# "app", not "oauth2-proxy": oauth2-proxy is not in the request path. Caddy
# sends only /oauth2/* (start, callback, sign-out) to it; everything else
# goes to the gateway, which decides access itself by asking oauth2-proxy's
# /oauth2/auth who the request's cookie belongs to (src/ontic_pages/auth.py),
# or by checking a command line token. The template's oauth2-proxy recipe
# requires every non-bypass route to go through oauth2-proxy, which is not
# this model (public pages are open to anyone).
recipe = "app"
# Probed through Caddy with no credentials, an invalid bearer token and
# forged identity headers. "/" redirects a browser without a session to this
# app's /oauth2/start and answers 401 to an invalid bearer token, so it
# accepts either; /_api/me and /_api/pages answer 401 to all three.
protected = [
  { path = "/", reject = ["sign-in", "401"] },
  { path = "/_api/me", reject = "401" },
  { path = "/_api/pages", reject = "401" },
]
# Where a "sign-in" redirect may point: the apex's own /oauth2/start, which
# Caddy sends to oauth2-proxy.
sign_in_redirects = ["https://pages.62-83-41-41.sslip.io/oauth2/start"]

[hooks]
pre_stop = ""
pre_stop_timeout_seconds = 600
# /oauth2/start reaching Google through Caddy, and the bucket's download
# CORS. (ontic-server itself asks the gateway's /_tls-ask about names that
# are not pages, from hosts/<host>.toml caddy_on_demand_ask.)
post_start = "hooks/post-start.sh"
post_start_timeout_seconds = 60
watchdog = ""
watchdog_timeout_seconds = 30
